name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1

  frontend:
    name: Frontend (Vite + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build --if-present

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache: true }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      # Start the API in the background with an in-memory dev config.
      - name: Start API
        run: |
          JWT_SECRET=ci-test-secret-abcdefghijklmnop-1234567890abcd \
          ENVIRONMENT=development \
          go run ./cmd/server &
          for i in {1..30}; do
            curl -sf http://localhost:8080/health && break || sleep 1
          done
      # Build the frontend against the local API and serve the dist.
      - name: Build & serve frontend
        working-directory: frontend
        run: |
          npm ci
          VITE_API_URL=http://localhost:8080 npm run build
          npx --yes serve -s dist -l 5173 &
          for i in {1..20}; do
            curl -sf http://localhost:5173 && break || sleep 1
          done
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: talkex-api:ci
      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: talkex-web:ci
