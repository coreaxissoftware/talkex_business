# business.talkex.in — marketing site (single-page, hash-routed).
#
# certbot --nginx will rewrite this after cert issuance to add:
#   listen 443 ssl http2;
#   ssl_certificate      /etc/letsencrypt/live/business.talkex.in/fullchain.pem;
#   ssl_certificate_key  /etc/letsencrypt/live/business.talkex.in/privkey.pem;
#   include              /etc/letsencrypt/options-ssl-nginx.conf;
#   ssl_dhparam          /etc/letsencrypt/ssl-dhparams.pem;
# and rewrite port-80 traffic to a redirect. Leave the pre-TLS template
# minimal so certbot's own edits are readable.

server {
    listen 80;
    listen [::]:80;
    server_name business.talkex.in www.business.talkex.in;

    root /var/www/business.talkex.in;
    index index.html;

    # Security headers — CSP mirrors marketing/vercel.json.
    add_header X-Content-Type-Options   "nosniff"                                       always;
    add_header X-Frame-Options          "DENY"                                          always;
    add_header X-XSS-Protection         "1; mode=block"                                 always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin"                               always;
    add_header Cross-Origin-Resource-Policy "same-site"                                 always;
    add_header Content-Security-Policy  "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://businessapp.talkex.in; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # www → apex.
    if ($host = www.business.talkex.in) {
        return 301 https://business.talkex.in$request_uri;
    }

    # Short-link redirects (parity with marketing/vercel.json).
    location = /signup { return 302 https://businessapp.talkex.in/register; }
    location = /login  { return 302 https://businessapp.talkex.in/login; }
    location = /app    { return 302 https://businessapp.talkex.in; }

    # SPA fallback — every unknown path serves index.html so the
    # hash-router can pick it up.
    location / {
        try_files $uri /index.html;
    }

    # index.html itself must not be cached — every reload should see the
    # freshest routing table pointing at fingerprinted assets.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Everything else can cache aggressively — the marketing site has no
    # fingerprinted assets today, but any future ones under /assets/ will
    # be immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
