# businessapp.talkex.in — Vite dashboard.
# SPA fallback + immutable caching on the fingerprinted assets folder.

server {
    listen 80;
    listen [::]:80;
    server_name businessapp.talkex.in;

    root /var/www/businessapp.talkex.in;
    index index.html;

    # Security headers — CSP mirrors deploy/vercel.json.
    add_header X-Content-Type-Options       "nosniff" always;
    add_header X-Frame-Options              "DENY"    always;
    add_header X-XSS-Protection             "1; mode=block" always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin"    always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "same-site"      always;
    add_header Content-Security-Policy      "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://businessapi.talkex.in; connect-src 'self' https://businessapi.talkex.in wss://businessapi.talkex.in; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # SPA fallback for react-router routes.
    location / {
        try_files $uri /index.html;
    }

    # Fingerprinted Vite assets — cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
}
