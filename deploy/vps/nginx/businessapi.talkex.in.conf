# businessapi.talkex.in — Go API reverse proxy.
#
# Fronts the Go binary listening on 127.0.0.1:8080 (see talkex-api.service).
# The API sets its own security headers (internal/middleware/security.go),
# so we don't duplicate them here — that would confuse the browser about
# which HSTS max-age to trust. We only add HSTS at the edge and let the
# app own the rest.

# Rate-limit the login endpoint at the edge as a first line of defence,
# even though the app has its own brute-force lockout. `zone` lives at
# http-scope; setup.sh drops this fragment into /etc/nginx/conf.d
# via a snippet include below.
limit_req_zone $binary_remote_addr zone=talkex_auth:10m rate=10r/m;

# WebSocket / SSE upgrade — the events hub streams over the same origin.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name businessapi.talkex.in;

    # Only the app itself sets HSTS; the edge just belt-and-braces it.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 10 MiB request body — matches internal/middleware/BodyLimit(10 MiB).
    client_max_body_size 12M;

    # Reasonable proxy timeouts. Long enough for a large campaign send,
    # short enough that a hung backend surfaces as 504 not a spinner.
    proxy_connect_timeout 5s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Rate-limit the brute-force targets at the edge.
    location = /auth/login {
        limit_req zone=talkex_auth burst=20 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
    }

    # Everything else pass-through.
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering    off;                       # SSE + streaming
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }

    # Never expose /metrics publicly — it leaks memory + goroutine counts.
    # ops scrapers hit 127.0.0.1:8080/metrics directly on the box.
    location = /metrics { return 403; }
}
